tbody tr:nth-child(even) { background: var(--zebra); }

  // Fill the no-JS table if the browser kept the noscript body (it does not when scripts run).
  var staticRows = document.getElementById("noscript-rows");
  if (staticRows) {
    var last = "";
    DATA.columns.forEach(function (row) {
      var tr = document.createElement("tr");
      var tableCell = document.createElement("td");
      tableCell.textContent = row.table === last ? "" : row.table;
      last = row.table;
      var col = document.createElement("td");
      col.className = "mono";
      col.textContent = row.column;
      var rule = document.createElement("td");
      rule.textContent = row.rule;
      var conf = document.createElement("td");
      conf.textContent = row.confidence;
      var filesCell = document.createElement("td");
      filesCell.textContent = filesLabel(row) + " · " + evidenceLabel(row.evidence);
      var status = document.createElement("td");
      status.textContent = (row.status === "documented" ? "Documented" : "Undocumented") + (row.reason ? ". " + row.reason : "") + (row.expires ? " until " + row.expires : "");
      tr.appendChild(tableCell);
      tr.appendChild(col);
      tr.appendChild(rule);
      tr.appendChild(conf);
      tr.appendChild(filesCell);
      tr.appendChild(status);
      staticRows.appendChild(tr);
    });
  }

  render();
  window.addEventListener("hashchange", render);
})();
</script>
</body>
</html>
