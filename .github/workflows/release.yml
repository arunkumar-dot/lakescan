name: Release

# A pushed tag vX.Y.Z builds, smoke-tests and packages every target, and
# creates a DRAFT GitHub Release from them, with notes from CHANGELOG.md.
# The draft is never published here: a person reviews and publishes it.
#
# Run by hand (workflow_dispatch), it is a dry run: the same builds, smoke
# tests, packages and SHA256SUMS, kept as workflow artifacts, and no release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Release builds use an exact Rust release at least 14 days old (1.99.0:
  # 2026-10-01), not whatever "stable" is today. RUSTUP_TOOLCHAIN overrides
  # rust-toolchain.toml, which pins "stable" for development.
  RUSTUP_TOOLCHAIN: "1.99.0"
  # Linux binaries link against glibc 2.17 (cargo-zigbuild's `.2.17` target
  # suffix), so they run on any distribution from 2014 on, including Amazon
  # Linux 2023 (glibc 2.34) and Ubuntu 22.04 (glibc 2.35). glibc rather than
  # musl, whose allocator is slow under LakeScan's concurrent scanning.
  GLIBC: "2.17"
  # Smoke-test images: dated tags at least 14 days old, pinned by digest.
  AMAZON_LINUX: amazonlinux:2023.12.20260918.0@sha256:5b29412077a463b4a3a8fbc99a8cdf4b929f38a3ecc8dac10328d8f36b0099b8
  UBUNTU: ubuntu:jammy-20260901.2@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02

# Every third-party action is pinned to a full commit SHA, with the release
# it corresponds to in a trailing comment; each release is at least 14 days
# old. Rust comes from the runner's preinstalled rustup, not an action.
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # Each Linux target builds natively, on a runner of its own
          # architecture (hosted arm64 runners are available to private
          # repositories), so no binary is run under emulation.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustc --version

      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --only-binary=:all: --require-hashes \
            -r .github/release-tools.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build (Linux, glibc ${{ env.GLIBC }})
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release --locked --target "$TARGET.$GLIBC"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test on the runner
        id: smoke
        env:
          TARGET: ${{ matrix.target }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          binary="target/$TARGET/release/lakescan"
          file "$binary"
          reported="$("$binary" --version)"
          echo "$reported"
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$reported" != "lakescan $version" ]; then
            echo "::error::--version says '$reported', Cargo.toml says $version"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the glibc baseline
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          newest="$(objdump -T "target/$TARGET/release/lakescan" \
            | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1)"
          echo "newest glibc symbol version: $newest"
          # The later of the two, by version order, must be the baseline.
          if [ "$(printf '%s\n' "$newest" "GLIBC_$GLIBC" | sort -V | tail -n 1)" != "GLIBC_$GLIBC" ]; then
            echo "::error::needs $newest, newer than the GLIBC_$GLIBC baseline"
            exit 1
          fi

      - name: Smoke test in Amazon Linux 2023 and Ubuntu 22.04
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          for image in "$AMAZON_LINUX" "$UBUNTU"; do
            echo "== ${image%%@*} ($PLATFORM)"
            docker run --rm --platform "$PLATFORM" \
              -v "$PWD/target/$TARGET/release:/dist:ro" "$image" \
              sh -c 'grep PRETTY_NAME /etc/os-release && ldd --version | head -n 1 && /dist/lakescan --version'
          done

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.smoke.outputs.version }}
        run: |
          name="lakescan-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/lakescan" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzvf "dist/$name.tar.gz"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download every package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write and check SHA256SUMS
        working-directory: dist
        run: |
          count="$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)"
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 packages, found $count"
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Build provenance, only for a tag on a public repository: attestations on
  # private repositories need GitHub Enterprise Cloud.
  attest:
    name: Attest build provenance
    needs: checksums
    if: github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  release:
    name: Draft GitHub Release
    needs: [checksums, attest]
    # Runs for a tag once the packages and checksums exist, whether the
    # attest job ran (public) or was skipped (private).
    if: >-
      !cancelled() && github.ref_type == 'tag'
      && needs.checksums.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Take the notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The lines after "## [X.Y.Z]" up to the next "## " heading.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "LakeScan $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
