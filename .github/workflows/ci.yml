name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      # The five acceptance gates, in order. `shell: bash` runs with -e, so the
      # first non-zero exit fails the step and therefore the job.
      - name: Gate 1 - formatting
        run: cargo fmt --all -- --check

      - name: Gate 2 - clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Gate 3 - check
        run: cargo check --all-targets --all-features

      - name: Gate 4 - tests
        run: cargo test --all-features

      - name: Gate 5 - release build and smoke run
        run: |
          cargo build --release
          ./target/release/lakescan
