[package]
name = "lakescan"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Finds personal data (PII) in S3 data lakes, starting with Parquet, and audits buckets from their object listing"
license = "FSL-1.1-ALv2"
repository = "https://github.com/arunkumar-dot/lakescan"
homepage = "https://github.com/arunkumar-dot/lakescan"
readme = "README.md"
keywords = ["s3", "pii", "parquet", "audit", "privacy"]
categories = ["command-line-utilities", "development-tools"]

# Dependencies are only added or upgraded to releases at least 14 days old.
[dependencies]
thiserror = "2"
# sync (the memory budget's semaphore) and time (the simulated store's
# latency) were already enabled through the AWS SDK; declared so the code
# that uses them doesn't depend on that.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
# Parquet decoding for content scanning: page and column readers only, no
# Arrow, and only the codecs data lakes use in practice.
parquet = { version = "=60.0.0", default-features = false, features = ["snap", "zstd", "flate2-zlib-rs", "lz4", "brotli"] }
regex = "1.13.1"
# GZIP and BROTLI pages are decompressed by LakeScan itself, bounded by the
# page's declared size (parquet's own decoders read to the end of the
# stream). Pinned to exactly the versions and features parquet's codec
# features already put in the build, so they add no code.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
brotli = { version = "=9.0.0", default-features = false, features = ["std"] }
# The --config file's SHA-256, recorded in every report. Pinned to exactly
# the version and features aws-sdk-s3 already puts in the build, so it adds
# no code.
sha2 = "=0.11.0"

# Test-only: tokio's paused clock, for the memory budget's wait limit.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "lakescan"

[[bin]]
name = "lakescan"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Unwind, not abort: `--pii` runs the third-party `parquet` parser on
# attacker-controlled bytes (anyone who can upload to a scanned bucket
# chooses them), and `content` contains a parser panic with
# `std::panic::catch_unwind`, turning it into a `content-not-scanned`
# finding for that one file. With `abort`, one crafted file would end the
# whole scan. LakeScan's own code still never panics: unwrap, expect,
# panic and indexing are denied by the lints above.
panic = "unwind"

# `panic` is deliberately NOT set for the `test` and `bench` profiles. Cargo
# ignores the key there unconditionally and always builds those targets with
# unwind, because the test and bench harnesses must be able to catch panics.
# Setting it explicitly only produces a "`panic` setting is ignored" manifest
# warning. Release and test now both unwind, so the panic-containment tests
# exercise the same behavior the binary has; do not add `panic` below.
[profile.bench]

[profile.test]
