[package]
name = "parquet-pii-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway measurement for docs/experiments/parquet-pii.md; never imported by lakescan"

# Standalone: not a member of the root lakescan package or any workspace.
[workspace]

# Dependencies are only added or upgraded to releases at least 14 days old.
[dependencies]
parquet = { version = "=60.0.0", default-features = false, features = ["snap", "zstd"] }
bytes = "=1.12.1"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
